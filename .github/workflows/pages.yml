# Publie le dossier "public" sur GitHub Pages a chaque mise a jour de la branche main.
# A activer une fois : depot GitHub > Settings > Pages > Source : "GitHub Actions".
name: Publier sur GitHub Pages

on:
  push:
    branches: [main]
    paths: ["public/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: public
      - id: publication
        uses: actions/deploy-pages@v5
